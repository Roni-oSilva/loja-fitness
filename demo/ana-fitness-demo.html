:root{--brand:#a5c910;--accent:#e4f58a;--ink:#0b102d;--graphite:#1b2250;--mist:#f3f6ea;--line:#e5e7eb;--brand-strong:#5f7409}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:#fff;overflow-x:hidden;-webkit-font-smoothing:antialiased}
h1,h2,h3,.d{font-family:Outfit,Inter,sans-serif;letter-spacing:-.02em;margin:0}
a{color:inherit}button{font:inherit;cursor:pointer}img{max-width:100%;display:block}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:12px}
.dark :focus-visible{outline-color:var(--brand)}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
@media(min-width:640px){.wrap{padding:0 28px}}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 26px;border-radius:999px;border:2px solid transparent;font:700 15px Outfit,sans-serif;text-decoration:none;transition:.25s;background:#fff;color:var(--ink)}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:scale(.96)}.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.btn.p{background:var(--brand);box-shadow:0 6px 0 -2px rgba(0,0,0,.18)}.btn.p:hover{box-shadow:0 12px 22px -8px var(--brand)}
.btn.k{background:var(--ink);color:#fff}.btn.o{border-color:var(--ink)}.btn.o:hover{background:var(--ink);color:#fff}
.btn.w{background:#fff;color:var(--ink)}.btn.g{border-color:rgba(255,255,255,.4);color:#fff;background:transparent}.btn.g:hover{background:#fff;color:var(--ink)}
.btn.s{min-height:38px;padding:6px 16px;font-size:13px}.btn.red{border-color:#b91c1c;color:#b91c1c}.btn.red:hover{background:#b91c1c;color:#fff}
.btn.lg{min-height:56px;padding:12px 34px;font-size:18px}
.eyebrow{display:inline-block;background:var(--accent);padding:5px 12px;border-radius:999px;font:700 11px Outfit;letter-spacing:.18em;text-transform:uppercase}
.card{background:#fff;border:1px solid var(--line);border-radius:24px}
input,select,textarea{font:inherit;width:100%;min-height:46px;padding:9px 14px;border:1px solid #d1d5db;border-radius:16px;background:#fff;color:var(--ink)}
input[type=checkbox],input[type=radio]{width:20px;min-height:20px;accent-color:var(--brand)}
label.l{display:block;font:600 13px Inter;margin:0 0 4px;color:var(--graphite)}
.muted{color:#4b5563}.small{font-size:13px}
/* demo bar */
#demobar{position:fixed;z-index:100;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;padding:5px;border-radius:999px;background:var(--ink);box-shadow:0 14px 34px -10px rgba(0,0,0,.6);max-width:calc(100vw - 20px)}
#demobar button{border:0;background:transparent;color:#fff;padding:10px 18px;border-radius:999px;font:700 13px Outfit;white-space:nowrap}
#demobar button.on{background:var(--brand);color:var(--ink)}
#demobar .rs{opacity:.7;font-weight:500}
/* promo */
.promo{background:var(--accent);text-align:center;font:600 13px Outfit;padding:8px 12px}
/* header */
.hdr{position:sticky;top:0;z-index:40;padding:8px 8px 0}
@media(min-width:640px){.hdr{padding:12px 16px 0}}
.hdr .in{max-width:1200px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;height:64px;border-radius:999px;background:rgba(11,16,45,.96);color:#fff;padding:0 8px;box-shadow:0 12px 30px -12px rgba(11,16,45,.6);backdrop-filter:blur(8px)}
@media(min-width:640px){.hdr .in{height:72px;padding:0 16px}}
.hdr nav{display:none;gap:2px}@media(min-width:900px){.hdr nav{display:flex}}
.hdr nav a,.ic{border-radius:999px;padding:9px 16px;font:600 14px Inter;text-decoration:none;transition:.2s}.hdr nav a:hover,.ic:hover{background:rgba(255,255,255,.12)}
.ic{display:grid;place-items:center;width:44px;height:44px;padding:0;border:0;background:transparent;color:#fff;position:relative}
.ic.cart{background:var(--brand);color:var(--ink)}.ic.cart:hover{background:var(--accent)}
.badge{position:absolute;right:-4px;top:-4px;min-width:20px;height:20px;border-radius:99px;background:#fff;color:var(--ink);font:800 11px Inter;display:grid;place-items:center;box-shadow:0 0 0 2px var(--ink)}
.brand{display:flex;align-items:center;gap:8px;text-decoration:none;justify-content:center;font:800 20px Outfit}
@media(min-width:640px){.brand{font-size:30px}}
.burger{display:grid}@media(min-width:900px){.burger{display:none}}
.hl{display:flex;align-items:center;gap:4px}.hr{display:flex;align-items:center;justify-content:flex-end}
.drawer{position:fixed;inset:0;z-index:60}.drawer .bg{position:absolute;inset:0;background:rgba(11,16,45,.7);backdrop-filter:blur(4px)}
.drawer .pn{position:absolute;left:8px;top:8px;bottom:8px;width:86%;max-width:360px;background:var(--ink);color:#fff;border-radius:32px;padding:20px;display:flex;flex-direction:column;gap:6px;animation:rise .4s both}
.drawer a{padding:12px 16px;border-radius:16px;font:700 22px Outfit;text-decoration:none}.drawer a:hover{background:rgba(255,255,255,.1)}
/* hero */
.hero{margin:12px 8px 0}@media(min-width:640px){.hero{margin:12px 16px 0}}
.hero .box{position:relative;isolation:isolate;overflow:hidden;max-width:1200px;margin:0 auto;border-radius:32px;background:var(--ink);color:#fff;padding:56px 24px;display:grid;gap:32px;align-items:center}
@media(min-width:640px){.hero .box{border-radius:48px;padding:80px 48px}}
@media(min-width:1000px){.hero .box{grid-template-columns:1.25fr 1fr;padding:96px 56px}}
.blob{position:absolute;border-radius:50%;filter:blur(60px);z-index:-1}
.hero h1{font-size:clamp(42px,8.6vw,88px);text-transform:uppercase;line-height:.95;font-weight:800;margin-top:18px}
.hero p.sub{max-width:520px;color:rgba(255,255,255,.8);font-size:17px;margin:22px 0 0}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px}
.brandcard{position:relative;justify-self:center;width:288px;height:288px;border-radius:48px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15);display:none;place-items:center}
@media(min-width:1000px){.brandcard{display:grid}}
.chip{position:absolute;border-radius:999px;padding:8px 16px;font:700 13px Outfit;box-shadow:0 10px 20px rgba(0,0,0,.3)}
/* marquee */
.marq{background:var(--ink);color:#fff;overflow:hidden;padding:22px 0;margin-top:28px}
.marq .t{display:flex;width:max-content;animation:marq 30s linear infinite}.marq:hover .t{animation-play-state:paused}
.marq span.i{display:flex;align-items:center;gap:36px;padding-right:36px;font:800 clamp(44px,8vw,96px) Outfit;white-space:nowrap}
@keyframes marq{to{transform:translateX(-50%)}}
/* sections */
section.s{margin-top:72px}@media(min-width:640px){section.s{margin-top:104px}}
.h2{font-size:clamp(34px,6vw,60px);font-weight:800;line-height:1.02}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:32px}.sh .eyebrow{margin-bottom:12px}
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;list-style:none;padding:0;margin:0}
@media(min-width:640px){.cats{gap:20px}}@media(min-width:1000px){.cats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cat{position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;aspect-ratio:4/5;border-radius:32px;background:var(--ink);color:#fff;padding:20px;text-decoration:none;cursor:pointer;border:0;text-align:left;transition:.4s}
@media(min-width:640px){.cat{aspect-ratio:1}}
.cat:hover,.lift:hover{transform:translateY(-6px);box-shadow:0 24px 40px -22px rgba(11,16,45,.5)}
.cat .arrow{position:absolute;right:16px;top:16px;width:40px;height:40px;border-radius:50%;background:var(--brand);color:var(--ink);display:grid;place-items:center;transition:.3s;font-weight:800}.cat:hover .arrow{transform:rotate(45deg)}
.cat .mk{position:absolute;right:-24px;top:-24px;width:150px;opacity:.28;transition:.7s}.cat:hover .mk{transform:rotate(90deg)}
.cat b{position:relative;font:800 26px/1.1 Outfit}.cat small{position:relative;opacity:.75;margin-top:4px}
.lift{transition:.4s cubic-bezier(.2,.7,.2,1)}
/* produtos */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 12px}@media(min-width:640px){.grid{gap:36px 20px}}@media(min-width:1000px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pc{position:relative;display:flex;flex-direction:column}
.pc .im{position:relative;display:block;aspect-ratio:4/5;border-radius:32px;overflow:hidden;background:var(--mist);cursor:pointer}
.pc .im img{width:100%;height:100%;object-fit:cover;transition:.6s}.pc .im:hover img{transform:scale(1.06)}
.tags{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}

.fav{position:absolute;right:10px;top:10px;width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.95);display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.1);transition:.2s;font-size:20px}
.fav:hover{transform:scale(1.1)}.fav.on{color:#dc2626}
.pc h3{font:600 16px Inter;margin-top:12px}.price{font:800 19px Outfit}.old{text-decoration:line-through;color:#6b7280;font-size:14px;margin-left:6px;font-weight:400}
.pc .acts{display:flex;gap:8px;margin-top:12px}.pc .acts .btn{flex:1;padding:6px 10px;min-height:40px;font-size:14px}

.chips{display:flex;flex-wrap:wrap;gap:6px}

.chipb.dis{opacity:.35;cursor:not-allowed;text-decoration:line-through}
.empty{border:2px dashed #d1d5db;border-radius:32px;background:var(--mist);padding:56px 20px;text-align:center}

.qty{display:inline-flex;align-items:center;border:2px solid #d1d5db;border-radius:999px}.qty button{width:44px;height:44px;border:0;background:transparent;font-size:20px;border-radius:50%}.qty button:disabled{opacity:.35}
.qty output{width:36px;text-align:center;font-weight:800}
.alert{border-radius:16px;padding:12px 16px;font:600 14px Inter}.alert.e{background:#fee2e2;color:#991b1b}.alert.o{background:#dcfce7;color:#14532d}.alert.w{background:#fef3c7;color:#78350f}

.cartg{display:grid;gap:28px;margin-top:24px}@media(min-width:1000px){.cartg{grid-template-columns:1fr 400px}}
.ci{display:flex;gap:14px;padding:18px 0;border-bottom:1px solid var(--line)}.ci .t{width:96px;height:96px;border-radius:20px;overflow:hidden;background:var(--mist);flex:none}.ci .t img{width:100%;height:100%;object-fit:cover}
.sum{padding:22px;position:sticky;top:100px;align-self:start}
.row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:14px}.row.tot{font:800 19px Outfit;border-top:1px solid var(--line);margin-top:8px;padding-top:12px}

.bgrid{display:grid;gap:16px;max-width:1200px;margin:0 auto}@media(min-width:640px){.bgrid{grid-template-columns:repeat(2,1fr)}}@media(min-width:1000px){..grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.bgrid>div{background:#fff;border-radius:32px;padding:24px}.bgrid .ico{width:56px;height:56px;border-radius:18px;background:var(--ink);color:var(--brand);display:grid;place-items:center;font-size:26px}
.banner{position:relative;overflow:hidden;isolation:isolate;border-radius:40px;background:var(--brand);padding:44px 28px;min-height:300px;display:flex;align-items:center}
@media(min-width:640px){.banner{padding:64px}}
.edit2{display:grid;gap:16px}@media(min-width:760px){.edit2{grid-template-columns:1fr 1fr}}

.foot{margin-top:80px;background:var(--ink);color:#fff;border-radius:40px 40px 0 0;padding:56px 0 100px}@media(min-width:640px){.foot{border-radius:64px 64px 0 0}}
.foot .fg{display:grid;gap:32px}@media(min-width:760px){.foot .fg{grid-template-columns:1.2fr 1fr 1fr 1fr}}

.receipt h2{font:800 32px Outfit;text-align:center;letter-spacing:.02em}.receipt .ds{border-top:1px dashed #555;margin:10px 0}
.receipt .rw{display:flex;justify-content:space-between;gap:10px}.receipt .edge{height:10px;margin:0 auto;max-width:380px;background:linear-gradient(135deg,transparent 50%,#f4f4f6 50%) 0 0/14px 10px,linear-gradient(225deg,transparent 50%,#f4f4f6 50%) 0 0/14px 10px}

.adm{min-height:100vh;background:var(--mist)}
@media(min-width:900px){.adm{display:grid;grid-template-columns:230px 1fr}}
.side{background:var(--ink);color:#fff}@media(min-width:900px){.side{position:sticky;top:0;height:100vh;overflow:auto;border-radius:0 32px 32px 0}}

.main{padding:18px 14px 110px;min-width:0}@media(min-width:900px){.main{padding:30px 34px 110px}}
.pgh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:22px}.pgh h1{font-size:38px;font-weight:800}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:1000px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border-radius:24px;padding:18px;border:1px solid var(--line)}.kpi small{font:700 11px Inter;text-transform:uppercase;letter-spacing:.06em;color:#4b5563}.kpi b{display:block;font:800 32px/1.05 Outfit;margin-top:6px}.kpi i{display:block;font-style:normal;font-size:12px;color:#4b5563;margin-top:4px}
.panel{background:#fff;border:1px solid var(--line);border-radius:28px;padding:20px;margin-top:18px}.panel h2{font:700 22px Outfit;margin-bottom:12px}
.tw{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:24px}table{border-collapse:collapse;width:100%;min-width:640px}
th{background:var(--mist);text-align:left;font:700 11px Inter;text-transform:uppercase;letter-spacing:.06em;color:#4b5563;padding:11px 14px}td{padding:12px 14px;border-top:1px solid #f0f0f0;font-size:14px;vertical-align:top}tr.hv:hover td{background:#fafcf4;cursor:pointer}

.st-pending_contact{background:#fef3c7;color:#78350f}.st-awaiting_confirmation{background:#e0f2fe;color:#0c4a6e}.st-confirmed{background:#ecfccb;color:#365314}.st-processing{background:#e0e7ff;color:#312e81}.st-shipped{background:#ede9fe;color:#4c1d95}.st-delivered{background:#bbf7d0;color:#14532d}.st-cancelled{background:#e5e7eb;color:#374151}
.on-p{background:#dcfce7;color:#14532d}.off-p{background:#e5e7eb;color:#374151}
.bars{display:flex;align-items:flex-end;gap:6px;height:170px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:10px;color:#4b5563}.bars i{display:block;width:100%;background:var(--brand);border-radius:10px 10px 0 0;transition:.6s;min-height:4px}
.two{display:grid;gap:18px}@media(min-width:1100px){.two{grid-template-columns:1fr 380px}}
.fgrid{display:grid;gap:14px}@media(min-width:700px){.fgrid.c2{grid-template-columns:1fr 1fr}.fgrid.c3{grid-template-columns:repeat(3,1fr)}}
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:16px;background:rgba(11,16,45,.6);backdrop-filter:blur(4px)}
.modal .box{background:#fff;border-radius:32px;max-width:560px;width:100%;max-height:92vh;overflow:auto;padding:26px;animation:rise .35s both}
.toast{position:fixed;z-index:120;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:12px 22px;font:700 14px Outfit;box-shadow:0 14px 30px rgba(0,0,0,.35);animation:rise .3s both}
.login{min-height:100vh;display:grid;place-items:center;background:var(--mist);padding:16px}.login .c{background:#fff;border-radius:36px;padding:34px;max-width:400px;width:100%;box-shadow:0 20px 50px -20px rgba(11,16,45,.3)}
.note{background:#fef3c7;color:#78350f;border-radius:16px;padding:10px 14px;font:600 13px Inter}
/* animação */
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-18px) scale(1.06)}}@keyframes spin{to{transform:rotate(360deg)}}
.rise{animation:rise .7s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*90ms)}
.float{animation:float 7s ease-in-out infinite}.spin{animation:spin 24s linear infinite;transform-origin:center}
.rv{opacity:0;transform:translateY(22px);transition:opacity .7s,transform .7s cubic-bezier(.2,.7,.2,1);transition-delay:calc(var(--i,0)*90ms)}.rv.in{opacity:1;transform:none}
/* mais movimento */
@keyframes pageIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}.pgin{animation:pageIn .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes prog{to{transform:scaleX(1)}}#prog{position:fixed;inset:0 0 auto 0;height:4px;background:var(--brand);transform:scaleX(0);transform-origin:0 50%;z-index:130;pointer-events:none}
@supports(animation-timeline:scroll()){#prog{animation:prog linear both;animation-timeline:scroll(root)}}
@keyframes sweep{to{transform:translateX(260%) skewX(-20deg)}}.btn.p{position:relative;overflow:hidden;isolation:isolate}.btn.p::after{content:"";position:absolute;inset:0 auto 0 -60%;width:40%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.6),transparent);transform:skewX(-20deg);z-index:-1}.btn.p:hover::after{animation:sweep .8s ease}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(165,201,16,.6)}100%{box-shadow:0 0 0 22px transparent}}.ring{animation:ring 2.2s ease-out infinite}
@keyframes pop{0%{transform:scale(.4)}55%{transform:scale(1.35)}100%{transform:scale(1)}}.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes wordIn{from{opacity:0;transform:translateY(.6em) rotate(3deg);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}.word{display:inline-block;animation:wordIn .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--w,0)*90ms + 150ms)}
@keyframes gx{to{background-position:200% 50%}}.shimmer{background:linear-gradient(90deg,var(--brand),var(--accent),#fff,var(--accent),var(--brand));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:gx 6s linear infinite}
.glow{background-image:radial-gradient(520px circle at var(--mx,70%) var(--my,20%),rgba(165,201,16,.28),transparent 60%)}.tilt{transition:transform .15s ease-out;transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg))}
@keyframes printOut{from{clip-path:inset(0 0 100% 0);transform:translateY(-24px)}to{clip-path:inset(0);transform:none}}.receipt{animation:printOut 1.8s cubic-bezier(.4,0,.2,1) both}

.back{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 18px;border:0;border-radius:999px;background:var(--mist);font:700 14px Inter;transition:.25s}.back:hover{background:var(--accent);transform:translateX(-3px)}

.steps{display:grid;gap:16px;position:relative}@media(min-width:640px){.steps{grid-template-columns:repeat(2,1fr)}}@media(min-width:1000px){.steps{grid-template-columns:repeat(4,1fr)}}
.step{background:#fff;border-radius:32px;padding:24px;box-shadow:inset 0 0 0 1px var(--line)}.step .ic2{position:relative;width:64px;height:64px;border-radius:24px;background:var(--ink);color:var(--brand);display:grid;place-items:center;font-size:30px}.step .n{position:absolute;right:-8px;top:-8px;width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--ink);font:800 14px Outfit;display:grid;place-items:center}
.cat.t1{background:var(--brand);color:var(--ink)}.cat.t2{background:var(--graphite)}.cat.t3{background:var(--accent);color:var(--ink)}
.cat .ci2{position:relative;margin-bottom:auto;width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:24px;transition:.3s}.cat:hover .ci2{transform:rotate(6deg) scale(1.1)}
.cat .bg{position:absolute;right:-14px;top:-18px;font-size:150px;opacity:.16;transform:rotate(12deg);transition:.7s;line-height:1}.cat:hover .bg{transform:rotate(-6deg) scale(1.1)}
.pc .im{background:linear-gradient(135deg,rgba(228,245,138,.6),var(--mist) 55%,#fff);box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.trust{display:grid;gap:8px;margin-top:18px}@media(min-width:640px){.trust{grid-template-columns:repeat(3,1fr)}}.trust li{background:var(--mist);border-radius:16px;padding:10px 12px;font:600 12px Inter;display:flex;gap:8px;align-items:center;list-style:none}
#app{padding-bottom:70px}
@media print{body>*:not(#print){display:none!important}#print{display:block!important}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>

    if (!isNaN(min) && price(p) < min) return false; if (!isNaN(max) && price(p) > max) return false; return true;
  });

    <fieldset class="fgrp"><legend>Tamanho</legend><div class="chips">${allSizes.map((s) => `<button class="chipb ${f.sizes.includes(s) ? "on" : ""}" data-a="ftoggle" data-k="sizes" data-v="${s}" aria-pressed="${f.sizes.includes(s)}">${s}</button>`).join("")}</div></fieldset>

}

/* ===== render ===== */
function render() {
  const r = route(), app = $("#app");
  let html;
  if (r[0] === "admin") {
    if (!S.ui.auth) html = adminLogin();
    else if (!r[1]) html = adminDash();
    else if (r[1] === "pedidos") html = r[2] ? adminOrder(r[2]) : adminOrders();
    else if (r[1] === "produtos") html = adminProducts();
    else if (r[1] === "estoque") html = adminStock();
    else if (r[1] === "cupons") html = adminCoupons();
    else if (r[1] === "banners") html = adminBanners();
    else if (r[1] === "clientes") html = adminCustomers();
    else if (r[1] === "configuracoes") html = adminSettings();
    else if (r[1] === "equipe") html = adminTeam();
    else html = adminDash();
  } else if (r[0] === "produtos") html = catalog();
  else if (r[0] === "produto") html = product(r[1]);
  else if (r[0] === "favoritos") html = favorites();

const cents = (s) => { const t = String(s).trim().replace(/R\$\s?/i, ""); if (!t) return null; const n = t.includes(",") ? t.replace(/\./g, "").replace(",", ".") : t; return /^\d+(\.\d{1,2})?$/.test(n) ? Math.round(parseFloat(n) * 100) : NaN; };
